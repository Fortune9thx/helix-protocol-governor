name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # KNOWN GAP: contracts are pinned to the consensus v0.6 RC py-genlayer
  # runner (see contracts/*.py headers and CLAUDE.md). The genvm-lint /
  # genlayer-test versions in requirements.txt predate that runner and hang
  # trying to auto-download an SDK build for it (there is no matching
  # GitHub release yet - the v0.6 runner ships through genlayer-studio's
  # RC tags instead). Both jobs are timeout-bounded so they fail fast
  # instead of hanging; update requirements.txt to the RC-compatible
  # genvm-linter/genlayer-test versions once published, then remove this
  # note.
  lint-contracts:
    name: Lint Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/genome_registry.py
      - run: genvm-lint check contracts/host_vault.py
      - run: genvm-lint check contracts/host_vault_v2.py
      - run: genvm-lint check contracts/watchdog.py
      - run: genvm-lint check contracts/helix.py

  test-direct:
    name: Direct Mode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/direct/ -v

  typecheck-frontend:
    name: Typecheck Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
